; ──────────────────────────────────────────────────────────────────────────────
;  ESP32-C3 LED Matrix Control – PlatformIO project configuration
;  Target: ESP32-C3 (MAX7219 FC16 matrix + captive-portal web UI)
; ──────────────────────────────────────────────────────────────────────────────
[platformio]
default_envs = esp32c3

[env:esp32c3]
platform        = espressif32
board           = esp32-c3-devkitm-1
framework       = arduino
monitor_speed   = 115200
upload_speed    = 115200
monitor_filters = esp32_exception_decoder

; 1.9 MB for the app instead of 1.25 MB. Needs a board with 4 MB of flash,
; which the SuperMini and the DevKitM-1 both have.
board_build.partitions = min_spiffs.csv

; Active firmware entry
build_src_filter = -<*> +<main.cpp>

lib_deps =
    majicdesigns/MD_Parola @ ^3.7.3
    majicdesigns/MD_MAX72XX @ ^3.5.1
    esp32async/ESPAsyncWebServer @ ^3.6.0
    esp32async/AsyncTCP @ ^3.3.2
    bblanchon/ArduinoJson @ ^7.2.0

build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=1
